<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t2 d2">
  <title id="t2">Figure 2. Assessment methodology</title>
  <desc id="d2">Six-stage authorized assessment pipeline from scope to report.</desc>
  <defs>
    <style>
      .title { font: 700 18px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 12px Helvetica, Arial, sans-serif; fill: #475569; }
      .n { font: 700 12px Helvetica, Arial, sans-serif; fill: #fff; }
      .h { font: 700 13px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .s { font: 11px Helvetica, Arial, sans-serif; fill: #334155; }
      .note { font: italic 11px Helvetica, Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" class="title">Fig. 2. Assessment methodology</text>
  <text x="480" y="48" text-anchor="middle" class="sub">Authorized use only · findings are unverified technical signals</text>

  <!-- stage 0 gate -->
  <rect x="40" y="72" width="880" height="44" rx="4" fill="#1e3a5f"/>
  <text x="480" y="100" text-anchor="middle" class="n">Gate: prior written authorization covering hosts, time window, and techniques</text>

  <!-- six boxes -->
  <rect x="40" y="140" width="130" height="150" rx="5" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1.4"/>
  <circle cx="105" cy="164" r="12" fill="#1e3a5f"/>
  <text x="105" y="168" text-anchor="middle" class="n">1</text>
  <text x="105" y="196" text-anchor="middle" class="h">Acquire</text>
  <text x="105" y="216" text-anchor="middle" class="s">host / CIDR / file</text>
  <text x="105" y="232" text-anchor="middle" class="s">OSINT (optional)</text>
  <text x="105" y="248" text-anchor="middle" class="s">discover ports</text>

  <line x1="170" y1="215" x2="198" y2="215" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="200" y="140" width="130" height="150" rx="5" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1.4"/>
  <circle cx="265" cy="164" r="12" fill="#1e3a5f"/>
  <text x="265" y="168" text-anchor="middle" class="n">2</text>
  <text x="265" y="196" text-anchor="middle" class="h">Fingerprint</text>
  <text x="265" y="216" text-anchor="middle" class="s">25 profiles</text>
  <text x="265" y="232" text-anchor="middle" class="s">body / header</text>
  <text x="265" y="248" text-anchor="middle" class="s">--platform override</text>

  <line x1="330" y1="215" x2="358" y2="215" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="360" y="140" width="130" height="150" rx="5" fill="#f0fdf4" stroke="#1e3a5f" stroke-width="1.4"/>
  <circle cx="425" cy="164" r="12" fill="#1e3a5f"/>
  <text x="425" y="168" text-anchor="middle" class="n">3</text>
  <text x="425" y="196" text-anchor="middle" class="h">Construct</text>
  <text x="425" y="216" text-anchor="middle" class="s">DAG from registry</text>
  <text x="425" y="232" text-anchor="middle" class="s">82 explicit edges</text>
  <text x="425" y="248" text-anchor="middle" class="s">ATT&amp;CK phases</text>

  <line x1="490" y1="215" x2="518" y2="215" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="520" y="140" width="130" height="150" rx="5" fill="#f0fdf4" stroke="#1e3a5f" stroke-width="1.4"/>
  <circle cx="585" cy="164" r="12" fill="#1e3a5f"/>
  <text x="585" y="168" text-anchor="middle" class="n">4</text>
  <text x="585" y="196" text-anchor="middle" class="h">Execute</text>
  <text x="585" y="216" text-anchor="middle" class="s">level-parallel</text>
  <text x="585" y="232" text-anchor="middle" class="s">HTTP / WS probes</text>
  <text x="585" y="248" text-anchor="middle" class="s">FP filters</text>

  <line x1="650" y1="215" x2="678" y2="215" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="680" y="140" width="130" height="150" rx="5" fill="#fff7ed" stroke="#1e3a5f" stroke-width="1.4"/>
  <circle cx="745" cy="164" r="12" fill="#1e3a5f"/>
  <text x="745" y="168" text-anchor="middle" class="n">5</text>
  <text x="745" y="196" text-anchor="middle" class="h">Record</text>
  <text x="745" y="216" text-anchor="middle" class="s">Finding objects</text>
  <text x="745" y="232" text-anchor="middle" class="s">chain traces</text>
  <text x="745" y="248" text-anchor="middle" class="s">evidence snippets</text>

  <line x1="810" y1="215" x2="838" y2="215" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="840" y="140" width="80" height="150" rx="5" fill="#faf5ff" stroke="#1e3a5f" stroke-width="1.4"/>
  <circle cx="880" cy="164" r="12" fill="#1e3a5f"/>
  <text x="880" y="168" text-anchor="middle" class="n">6</text>
  <text x="880" y="196" text-anchor="middle" class="h">Report</text>
  <text x="880" y="216" text-anchor="middle" class="s">JSON</text>
  <text x="880" y="232" text-anchor="middle" class="s">HTML</text>
  <text x="880" y="248" text-anchor="middle" class="s">MD</text>

  <text x="480" y="330" text-anchor="middle" class="note">Independent verification is required before treating a hit as a confirmed vulnerability.</text>

  <!-- feedback -->
  <path d="M 880 290 C 880 360, 105 360, 105 290" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="480" y="388" text-anchor="middle" class="s">optional: refine scope / --platform / --severity-filter and re-run</text>
</svg>
