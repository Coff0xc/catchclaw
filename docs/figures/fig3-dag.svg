<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t3">
  <title id="t3">Figure 3. DAG execution model</title>
  <defs>
    <filter id="lift" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1A1A" flood-opacity="0.06"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B1E3F"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif; }
      .k { font-size: 11px; letter-spacing: 0.22em; fill: #8B1E3F; font-weight: 600; }
      .t { font-size: 22px; fill: #1A1A1A; font-weight: 600; }
      .d { font-size: 13px; fill: #6B6560; }
      .lane { font-size: 11px; letter-spacing: 0.16em; fill: #8B1E3F; font-weight: 700; }
      .h { font-size: 13px; fill: #1A1A1A; font-weight: 600; }
      .s { font-size: 11px; fill: #6B6560; }
    </style>
  </defs>
  <rect width="1080" height="560" fill="#F7F5F0"/>
  <text x="56" y="42" class="k">EXECUTION MODEL</text>
  <text x="56" y="74" class="t">Directed acyclic graph, ATT&amp;CK-shaped</text>
  <text x="56" y="98" class="d">82 handwritten nodes carry DependsOn. Checks and chains join as unconstrained peers.</text>
  <line x1="56" y1="114" x2="1024" y2="114" stroke="#E4DFD6" stroke-width="1"/>

  <!-- lanes background -->
  <rect x="56" y="136" width="968" height="88" rx="14" fill="#FFFcf8"/>
  <rect x="56" y="236" width="968" height="88" rx="14" fill="#FFFcf8"/>
  <rect x="56" y="336" width="968" height="88" rx="14" fill="#FFFcf8"/>
  <rect x="56" y="436" width="968" height="72" rx="14" fill="#1A1A1A"/>

  <text x="80" y="164" class="lane">RECON</text>
  <rect x="200" y="152" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="275" y="176" text-anchor="middle" class="h">cors_bypass</text>
  <text x="275" y="194" text-anchor="middle" class="s">N0  ·  origin</text>
  <rect x="368" y="152" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="443" y="176" text-anchor="middle" class="h">ws_hijack</text>
  <text x="443" y="194" text-anchor="middle" class="s">N1  ·  upgrade</text>
  <rect x="536" y="152" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="611" y="176" text-anchor="middle" class="h">auth_mode</text>
  <text x="611" y="194" text-anchor="middle" class="s">N2  ·  surface</text>
  <rect x="704" y="152" width="292" height="56" rx="10" fill="#F7F5F0" stroke="#E4DFD6" stroke-dasharray="5 4"/>
  <text x="850" y="176" text-anchor="middle" class="h">unconstrained pool</text>
  <text x="850" y="194" text-anchor="middle" class="s">269 checks + 42 chains + probes</text>

  <!-- arrows recon -> access -->
  <line x1="275" y1="208" x2="275" y2="248" stroke="#8B1E3F" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="275" y1="208" x2="443" y2="248" stroke="#8B1E3F" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="275" y1="208" x2="611" y2="248" stroke="#8B1E3F" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="443" y1="208" x2="780" y2="248" stroke="#8B1E3F" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="611" y1="208" x2="443" y2="248" stroke="#8B1E3F" stroke-width="1.15" marker-end="url(#arr)"/>

  <text x="80" y="264" class="lane">ACCESS</text>
  <rect x="200" y="252" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="275" y="276" text-anchor="middle" class="h">ssrf</text>
  <text x="275" y="294" text-anchor="middle" class="s">IMDS · internal</text>
  <rect x="368" y="252" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="443" y="276" text-anchor="middle" class="h">oauth / pair</text>
  <text x="443" y="294" text-anchor="middle" class="s">depends N0, N2</text>
  <rect x="536" y="252" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="611" y="276" text-anchor="middle" class="h">prompt_inject</text>
  <text x="611" y="294" text-anchor="middle" class="s">depends N0</text>
  <rect x="704" y="252" width="152" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="780" y="276" text-anchor="middle" class="h">ws_fuzz</text>
  <text x="780" y="294" text-anchor="middle" class="s">depends N1</text>

  <line x1="275" y1="308" x2="275" y2="348" stroke="#8B1E3F" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="611" y1="308" x2="443" y2="348" stroke="#8B1E3F" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="275" y1="308" x2="611" y2="348" stroke="#8B1E3F" stroke-width="1.15" marker-end="url(#arr)"/>

  <text x="80" y="364" class="lane">EXECUTE</text>
  <rect x="200" y="352" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="275" y="376" text-anchor="middle" class="h">rce / eval</text>
  <text x="275" y="394" text-anchor="middle" class="s">from inject</text>
  <rect x="368" y="352" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="443" y="376" text-anchor="middle" class="h">agent_inject</text>
  <text x="443" y="394" text-anchor="middle" class="s">from prompt</text>
  <rect x="536" y="352" width="150" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="611" y="376" text-anchor="middle" class="h">skill_poison</text>
  <text x="611" y="394" text-anchor="middle" class="s">persistence</text>
  <rect x="704" y="352" width="152" height="56" rx="10" fill="#F7F5F0" filter="url(#lift)"/>
  <text x="780" y="376" text-anchor="middle" class="h">cron / session</text>
  <text x="780" y="394" text-anchor="middle" class="s">from N0 / RCE</text>

  <line x1="275" y1="408" x2="275" y2="448" stroke="#E8C4C8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="443" y1="408" x2="443" y2="448" stroke="#E8C4C8" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="611" y1="408" x2="611" y2="448" stroke="#E8C4C8" stroke-width="1.15" marker-end="url(#arr)"/>

  <text x="80" y="464" fill="#E8C4C8" style="font-size:11px;letter-spacing:0.16em;fill:#E8C4C8;font-weight:700">EXFIL</text>
  <rect x="200" y="448" width="150" height="44" rx="10" fill="#2A2424"/>
  <text x="275" y="475" text-anchor="middle" fill="#F7F5F0" style="font-size:13px;font-weight:650;fill:#F7F5F0">c2 / transcript</text>
  <rect x="368" y="448" width="150" height="44" rx="10" fill="#2A2424"/>
  <text x="443" y="475" text-anchor="middle" fill="#F7F5F0" style="font-size:13px;font-weight:650;fill:#F7F5F0">secret_extract</text>
  <rect x="536" y="448" width="150" height="44" rx="10" fill="#2A2424"/>
  <text x="611" y="475" text-anchor="middle" fill="#F7F5F0" style="font-size:13px;font-weight:650;fill:#F7F5F0">memory / talk</text>

  <text x="540" y="538" text-anchor="middle" class="s">Solid edges: DependsOn. Dashed pool: no predecessor — scheduled with other unconstrained nodes.</text>
</svg>
