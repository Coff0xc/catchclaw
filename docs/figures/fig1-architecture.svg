<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t1 d1">
  <title id="t1">Figure 1. CatchClaw system architecture</title>
  <desc id="d1">Layered architecture: operator surface, command ingress, DAG orchestration, module knowledge base, transport, and reporting.</desc>
  <defs>
    <style>
      .title { font: 700 18px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 12px Helvetica, Arial, sans-serif; fill: #475569; }
      .layer-lab { font: 700 11px Helvetica, Arial, sans-serif; fill: #1e3a5f; }
      .box-t { font: 700 13px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .box-s { font: 11px Helvetica, Arial, sans-serif; fill: #334155; }
      .cap { font: italic 12px Helvetica, Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" class="title">Fig. 1. System architecture (CatchClaw v6.0, Go)</text>
  <text x="480" y="52" text-anchor="middle" class="sub">Single binary · authorized assessment of self-hosted AI / LLM infrastructure</text>

  <!-- L5 operator -->
  <rect x="40" y="72" width="880" height="78" rx="6" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="56" y="94" class="layer-lab">L5  OPERATOR SURFACE</text>
  <rect x="70" y="106" width="250" height="32" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="195" y="127" text-anchor="middle" class="box-t">CLI  (scan / chain / discover / …)</text>
  <rect x="355" y="106" width="250" height="32" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="480" y="127" text-anchor="middle" class="box-t">MCP stdio  (allowlisted tools)</text>
  <rect x="640" y="106" width="250" height="32" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="765" y="127" text-anchor="middle" class="box-t">Config  YAML / TOML / JSON</text>

  <polygon points="480,150 474,164 486,164" fill="#1e3a5f"/>
  <line x1="480" y1="150" x2="480" y2="164" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- L4 orchestration -->
  <rect x="40" y="172" width="880" height="100" rx="6" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="56" y="194" class="layer-lab">L4  ORCHESTRATION</text>
  <rect x="70" y="208" width="400" height="48" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="270" y="228" text-anchor="middle" class="box-t">DAG engine</text>
  <text x="270" y="246" text-anchor="middle" class="box-s">Kahn topological levels · semaphore · goroutines</text>
  <rect x="500" y="208" width="380" height="48" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="690" y="228" text-anchor="middle" class="box-t">Platform registry</text>
  <text x="690" y="246" text-anchor="middle" class="box-s">25 profiles · fingerprint · endpoint map</text>

  <polygon points="480,272 474,286 486,286" fill="#1e3a5f"/>
  <line x1="480" y1="272" x2="480" y2="286" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- L3 knowledge -->
  <rect x="40" y="294" width="880" height="118" rx="6" fill="#f0fdf4" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="56" y="316" class="layer-lab">L3  KNOWLEDGE BASE  —  412 registered modules</text>
  <rect x="70" y="328" width="200" height="66" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="170" y="354" text-anchor="middle" class="box-t">101 exploits</text>
  <text x="170" y="372" text-anchor="middle" class="box-s">handwritten Module.Run</text>
  <rect x="290" y="328" width="200" height="66" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="390" y="354" text-anchor="middle" class="box-t">269 HTTP checks</text>
  <text x="390" y="372" text-anchor="middle" class="box-s">path · status · keyword</text>
  <rect x="510" y="328" width="180" height="66" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="600" y="354" text-anchor="middle" class="box-t">42 chains</text>
  <text x="600" y="372" text-anchor="middle" class="box-s">state passing {token}</text>
  <rect x="710" y="328" width="180" height="66" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="800" y="354" text-anchor="middle" class="box-t">payloads + Nuclei</text>
  <text x="800" y="372" text-anchor="middle" class="box-s">YAML libraries · 45 IDs</text>

  <polygon points="480,412 474,426 486,426" fill="#1e3a5f"/>
  <line x1="480" y1="412" x2="480" y2="426" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- L2 transport -->
  <rect x="40" y="434" width="880" height="78" rx="6" fill="#fff7ed" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="56" y="456" class="layer-lab">L2  TRANSPORT</text>
  <rect x="70" y="470" width="260" height="28" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="200" y="489" text-anchor="middle" class="box-s">HTTP  (no redirect · TLS skip-verify)</text>
  <rect x="350" y="470" width="250" height="28" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="475" y="489" text-anchor="middle" class="box-s">WebSocket JSON-RPC</text>
  <rect x="620" y="470" width="270" height="28" rx="4" fill="#fff" stroke="#1e3a5f"/>
  <text x="755" y="489" text-anchor="middle" class="box-s">OSINT  Shodan · FOFA · Hunter</text>

  <polygon points="480,512 474,526 486,526" fill="#1e3a5f"/>
  <line x1="480" y1="512" x2="480" y2="526" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- L1 output -->
  <rect x="40" y="534" width="880" height="56" rx="6" fill="#faf5ff" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="56" y="556" class="layer-lab">L1  EVIDENCE  (unverified signals)</text>
  <text x="480" y="574" text-anchor="middle" class="box-t">Finding  ·  severity  ·  JSON / HTML / Markdown  ·  Mermaid attack graph</text>
</svg>
