name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    if: github.repository == 'Coff0xc/catchclaw'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: catchclaw
            archive: catchclaw-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            artifact: catchclaw
            archive: catchclaw-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            artifact: catchclaw
            archive: catchclaw-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            artifact: catchclaw
            archive: catchclaw-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            artifact: catchclaw.exe
            archive: catchclaw-windows-amd64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Package
        working-directory: go
        run: |
          set -euo pipefail
          cp ../LICENSE ../LEGAL.md .
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${{ matrix.archive }}" "${{ matrix.artifact }}" LICENSE LEGAL.md
          else
            tar czf "${{ matrix.archive }}" "${{ matrix.artifact }}" LICENSE LEGAL.md
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: go/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: github-release
    needs: build
    if: github.repository == 'Coff0xc/catchclaw'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum catchclaw-*.tar.gz catchclaw-*.zip | tee SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/catchclaw-*.tar.gz
            dist/catchclaw-*.zip
            dist/SHA256SUMS.txt
