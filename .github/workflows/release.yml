name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: catchclaw
            archive: catchclaw-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            artifact: catchclaw
            archive: catchclaw-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            artifact: catchclaw
            archive: catchclaw-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            artifact: catchclaw
            archive: catchclaw-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            artifact: catchclaw.exe
            archive: catchclaw-windows-amd64.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Package (tar)
        if: matrix.goos != 'windows'
        working-directory: go
        run: tar czf ${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Package (zip)
        if: matrix.goos == 'windows'
        working-directory: go
        run: zip ${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: go/${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
