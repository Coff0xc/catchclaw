name: Bug Report
description: Report a bug in CatchClaw
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CatchClaw Version
      placeholder: "6.0.0"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Commands or steps to reproduce the issue
      placeholder: |
        1. Run `catchclaw scan -t ...`
        2. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: checkboxes
    id: authorized
    attributes:
      label: Authorized use
      options:
        - label: This report does not include credentials, customer data, or evidence from systems I am not authorized to test
          required: true
