version: "2"

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
    misspell:
      locale: US

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
